name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is on main
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+\.\d+$') {
            throw 'Release tags must use the format vMAJOR.MINOR.BUILD.REVISION.'
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The tagged commit must be merged into main before releasing.'
          }
      - uses: microsoft/setup-msbuild@v3
      - name: Build Release
        run: |
          msbuild Windows_Spotlight.sln /t:Rebuild /p:Configuration=Release /p:UseSharedCompilation=false /m:1 /nodeReuse:false /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Run fixture tests
        run: |
          .\tests\bin\Release\WindowsSpotlight.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fixture tests failed.' }
      - name: Verify versions and prepare assets
        run: .\scripts\Prepare-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG `
            --verify-tag `
            --generate-notes `
            --title "Windows Spotlight $env:RELEASE_TAG" `
            .\artifacts\release\Windows-Spotlight.exe `
            .\artifacts\release\Windows-Spotlight.exe.config `
            .\artifacts\release\SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
